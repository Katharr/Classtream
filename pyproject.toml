[project]
name = "classtream"
version = "1.0.1"
description = "Real-time multi-monitor screen sharing for classrooms — with group chat, voice chat, and fine-grained access control"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["screen-sharing", "classroom", "fastapi", "websocket", "teaching", "live-streaming"]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "mss>=9.0.0",
    "numpy>=1.26.0",
    "opencv-python>=4.9.0",
    "pyautogui>=0.9.54",
    "websockets>=12.0",
]

[project.optional-dependencies]
windows-lan = [
    "dxcam==0.3.0; sys_platform == 'win32'",
    "comtypes==1.4.17; sys_platform == 'win32'",
]

[project.scripts]
classtream = "app.cli:main"

[project.urls]
Repository = "https://github.com/Katharr/Classtream"
Issues     = "https://github.com/Katharr/Classtream/issues"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = [
    "app/**",
    "main.py",
    "README.md",
    "LICENSE",
    "CONTRIBUTING.md",
    "assets/**",
]
